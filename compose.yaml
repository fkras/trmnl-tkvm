services:
  takvimi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TRMNL_WEBHOOK_URL: ${TRMNL_WEBHOOK_URL:-}
      TZ: ${TZ:-Europe/Belgrade}
    ports:
      - "${BIND_IP:-0.0.0.0}:${HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      takvimi:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      TARGET_URL: ${TRMNL_TARGET_URL:-http://takvimi:3000/trmnl}
      CACHE_TTL_MS: ${TRMNL_CACHE_TTL_MS:-60000}
      TZ: ${TZ:-Europe/Belgrade}
    ports:
      - "${BIND_IP:-0.0.0.0}:${RENDERER_HOST_PORT:-3101}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  trmnl-pusher:
    image: curlimages/curl:8.15.0
    restart: unless-stopped
    depends_on:
      takvimi:
        condition: service_healthy
    environment:
      TRMNL_PUSH_URL: http://takvimi:3000/api/trmnl/push
      TRMNL_PUSH_INTERVAL: ${TRMNL_PUSH_INTERVAL:-300}
    command:
      [
        "sh",
        "-c",
        "while true; do curl -fsS -X POST \"$${TRMNL_PUSH_URL}\" || true; sleep \"$${TRMNL_PUSH_INTERVAL}\"; done",
      ]
